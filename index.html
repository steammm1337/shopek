<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomb of Osiris - Egyptian Dungeon Crawler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #d4af37;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 960px;
            height: 720px;
            border: 4px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 2px solid #d4af37;
            font-size: 14px;
        }

        #hpBar {
            width: 200px;
            height: 20px;
            background: #300;
            border: 2px solid #d4af37;
            display: inline-block;
            vertical-align: middle;
            position: relative;
        }

        #hpFill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6600);
            transition: width 0.3s;
        }

        #laserCharges {
            display: inline-block;
            margin-left: 20px;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 2px solid #d4af37;
            font-size: 12px;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 4px solid #d4af37;
            text-align: center;
            font-size: 24px;
            display: none;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 30px;
            background: #d4af37;
            border: none;
            color: #000;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        #gameOver button:hover {
            background: #ffd700;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="320" height="240"></canvas>
        <div id="ui">
            <span>HP: </span>
            <div id="hpBar"><div id="hpFill" style="width: 100%"></div></div>
            <span id="laserCharges">⚡ Лазер: 5</span>
            <span style="margin-left: 20px;" id="parryStatus"></span>
        </div>
        <div id="controls">
            WASD/Стрелки - движение | ПРОБЕЛ - лазер | K - парирование | Цель: найти Кристалл Осириса ◈
        </div>
        <div id="gameOver">
            <div id="gameOverText"></div>
            <button onclick="location.reload()">Играть снова</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // Game constants
        const TILE_SIZE = 16;
        const MAP_WIDTH = 50;
        const MAP_HEIGHT = 40;
        const VISION_RADIUS = 80;
        const PLAYER_SPEED = 2;
        const LASER_SPEED = 4;
        const ENEMY_SPEED = 0.5;
        const PARRY_WINDOW = 300; // ms

        // Game state
        let gameState = {
            player: {
                x: 80,
                y: 80,
                hp: 100,
                maxHp: 100,
                laserCharges: 5,
                canParry: true,
                parryActive: false,
                parryTime: 0
            },
            enemies: [],
            mirrors: [],
            lasers: [],
            crystal: null,
            map: [],
            keys: {},
            gameOver: false,
            victory: false,
            camera: { x: 0, y: 0 }
        };

        // Initialize map
        function initMap() {
            // Create walls
            gameState.map = Array(MAP_HEIGHT).fill(0).map(() => Array(MAP_WIDTH).fill(1));

            // Carve rooms and corridors
            carveRoom(5, 5, 10, 8); // Starting room
            carveRoom(20, 5, 12, 10); // Puzzle room with mirrors
            carveRoom(35, 3, 10, 12); // Combat room
            carveRoom(25, 20, 8, 8); // Final room with crystal

            // Corridors
            carveCorridor(15, 9, 20, 9);
            carveCorridor(32, 9, 35, 9);
            carveCorridor(29, 15, 29, 20);
        }

        function carveRoom(x, y, w, h) {
            for (let dy = 0; dy < h; dy++) {
                for (let dx = 0; dx < w; dx++) {
                    if (y + dy < MAP_HEIGHT && x + dx < MAP_WIDTH) {
                        gameState.map[y + dy][x + dx] = 0;
                    }
                }
            }
        }

        function carveCorridor(x1, y1, x2, y2) {
            if (x1 === x2) {
                for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                    if (y < MAP_HEIGHT) gameState.map[y][x1] = 0;
                }
            } else {
                for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                    if (x < MAP_WIDTH) gameState.map[y1][x] = 0;
                }
            }
        }

        // Initialize entities
        function initEntities() {
            // Mirrors in puzzle room (angle: 0 = \, 1 = /)
            gameState.mirrors = [
                { x: 22 * TILE_SIZE, y: 7 * TILE_SIZE, angle: 1 },
                { x: 26 * TILE_SIZE, y: 7 * TILE_SIZE, angle: 0 },
                { x: 24 * TILE_SIZE, y: 10 * TILE_SIZE, angle: 1 },
                { x: 28 * TILE_SIZE, y: 12 * TILE_SIZE, angle: 0 }
            ];

            // Enemies
            gameState.enemies = [
                { x: 37 * TILE_SIZE, y: 6 * TILE_SIZE, hp: 60, maxHp: 60, type: 'anubis', charging: false, chargeTime: 0, stunned: false },
                { x: 40 * TILE_SIZE, y: 10 * TILE_SIZE, hp: 40, maxHp: 40, type: 'mummy', charging: false, chargeTime: 0, stunned: false },
                { x: 36 * TILE_SIZE, y: 12 * TILE_SIZE, hp: 40, maxHp: 40, type: 'mummy', charging: false, chargeTime: 0, stunned: false }
            ];

            // Crystal
            gameState.crystal = { x: 29 * TILE_SIZE, y: 24 * TILE_SIZE };
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.key.toLowerCase()] = true;

            if (e.key === ' ' && !gameState.gameOver) {
                e.preventDefault();
                fireLaser();
            }

            if (e.key.toLowerCase() === 'k' && !gameState.gameOver) {
                activateParry();
            }
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.key.toLowerCase()] = false;
        });

        // Player movement
        function updatePlayer(dt) {
            let dx = 0, dy = 0;

            if (gameState.keys['w'] || gameState.keys['arrowup']) dy -= PLAYER_SPEED;
            if (gameState.keys['s'] || gameState.keys['arrowdown']) dy += PLAYER_SPEED;
            if (gameState.keys['a'] || gameState.keys['arrowleft']) dx -= PLAYER_SPEED;
            if (gameState.keys['d'] || gameState.keys['arrowright']) dx += PLAYER_SPEED;

            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            // Check collision
            const newX = gameState.player.x + dx;
            const newY = gameState.player.y + dy;

            if (!checkCollision(newX, gameState.player.y)) {
                gameState.player.x = newX;
            }
            if (!checkCollision(gameState.player.x, newY)) {
                gameState.player.y = newY;
            }

            // Check crystal pickup
            if (gameState.crystal) {
                const dist = Math.hypot(gameState.player.x - gameState.crystal.x, gameState.player.y - gameState.crystal.y);
                if (dist < TILE_SIZE) {
                    gameState.victory = true;
                    endGame(true);
                }
            }

            // Update parry cooldown
            if (gameState.player.parryActive) {
                if (Date.now() - gameState.player.parryTime > PARRY_WINDOW) {
                    gameState.player.parryActive = false;
                    document.getElementById('parryStatus').textContent = '';
                }
            }
        }

        function checkCollision(x, y) {
            const tileX = Math.floor(x / TILE_SIZE);
            const tileY = Math.floor(y / TILE_SIZE);

            if (tileX < 0 || tileX >= MAP_WIDTH || tileY < 0 || tileY >= MAP_HEIGHT) return true;
            return gameState.map[tileY][tileX] === 1;
        }

        // Laser mechanics
        function fireLaser() {
            if (gameState.player.laserCharges <= 0) return;

            gameState.player.laserCharges--;
            document.getElementById('laserCharges').textContent = `⚡ Лазер: ${gameState.player.laserCharges}`;

            // Determine direction based on last movement
            let dx = 1, dy = 0;
            if (gameState.keys['w'] || gameState.keys['arrowup']) { dx = 0; dy = -1; }
            else if (gameState.keys['s'] || gameState.keys['arrowdown']) { dx = 0; dy = 1; }
            else if (gameState.keys['a'] || gameState.keys['arrowleft']) { dx = -1; dy = 0; }

            gameState.lasers.push({
                x: gameState.player.x,
                y: gameState.player.y,
                dx: dx * LASER_SPEED,
                dy: dy * LASER_SPEED,
                bounces: 0,
                maxBounces: 5
            });
        }

        function updateLasers(dt) {
            gameState.lasers = gameState.lasers.filter(laser => {
                laser.x += laser.dx;
                laser.y += laser.dy;

                // Check wall collision
                if (checkCollision(laser.x, laser.y)) {
                    return false;
                }

                // Check mirror collision
                for (let mirror of gameState.mirrors) {
                    const dist = Math.hypot(laser.x - mirror.x, laser.y - mirror.y);
                    if (dist < TILE_SIZE / 2) {
                        if (laser.bounces >= laser.maxBounces) return false;

                        // Reflect laser
                        if (mirror.angle === 0) { // \ mirror
                            [laser.dx, laser.dy] = [laser.dy, laser.dx];
                        } else { // / mirror
                            [laser.dx, laser.dy] = [-laser.dy, -laser.dx];
                        }
                        laser.bounces++;
                        break;
                    }
                }

                // Check enemy collision
                for (let enemy of gameState.enemies) {
                    const dist = Math.hypot(laser.x - enemy.x, laser.y - enemy.y);
                    if (dist < TILE_SIZE / 2) {
                        enemy.hp -= 50;
                        if (enemy.hp <= 0) {
                            gameState.enemies = gameState.enemies.filter(e => e !== enemy);
                        }
                        return false;
                    }
                }

                // Check bounds
                if (laser.x < 0 || laser.x > MAP_WIDTH * TILE_SIZE ||
                    laser.y < 0 || laser.y > MAP_HEIGHT * TILE_SIZE) {
                    return false;
                }

                return true;
            });
        }

        // Parry mechanics
        function activateParry() {
            if (!gameState.player.canParry) return;

            gameState.player.parryActive = true;
            gameState.player.parryTime = Date.now();
            gameState.player.canParry = false;

            document.getElementById('parryStatus').textContent = '🛡️ ПАРИРОВАНИЕ!';

            setTimeout(() => {
                gameState.player.canParry = true;
            }, 1000);
        }

        // Enemy AI
        function updateEnemies(dt) {
            for (let enemy of gameState.enemies) {
                if (enemy.stunned) {
                    enemy.stunned = false;
                    continue;
                }

                const dist = Math.hypot(enemy.x - gameState.player.x, enemy.y - gameState.player.y);

                // Check if in vision range
                if (dist > VISION_RADIUS) continue;

                // Move towards player
                if (dist > TILE_SIZE) {
                    const angle = Math.atan2(gameState.player.y - enemy.y, gameState.player.x - enemy.x);
                    const newX = enemy.x + Math.cos(angle) * ENEMY_SPEED;
                    const newY = enemy.y + Math.sin(angle) * ENEMY_SPEED;

                    if (!checkCollision(newX, enemy.y)) enemy.x = newX;
                    if (!checkCollision(enemy.x, newY)) enemy.y = newY;
                }

                // Attack logic
                if (dist < TILE_SIZE * 1.5) {
                    if (!enemy.charging) {
                        enemy.charging = true;
                        enemy.chargeTime = Date.now();
                    } else if (Date.now() - enemy.chargeTime > 1000) {
                        // Execute attack
                        if (gameState.player.parryActive && Date.now() - gameState.player.parryTime < PARRY_WINDOW) {
                            // Successful parry
                            enemy.hp -= 30;
                            enemy.stunned = true;
                            if (enemy.hp <= 0) {
                                gameState.enemies = gameState.enemies.filter(e => e !== enemy);
                            }
                        } else {
                            // Hit player
                            const damage = gameState.player.parryActive ? 30 : 15;
                            gameState.player.hp -= damage;
                            updateHP();

                            if (gameState.player.hp <= 0) {
                                endGame(false);
                            }
                        }

                        enemy.charging = false;
                    }
                }
            }
        }

        // Camera
        function updateCamera() {
            gameState.camera.x = gameState.player.x - canvas.width / 2;
            gameState.camera.y = gameState.player.y - canvas.height / 2;

            gameState.camera.x = Math.max(0, Math.min(gameState.camera.x, MAP_WIDTH * TILE_SIZE - canvas.width));
            gameState.camera.y = Math.max(0, Math.min(gameState.camera.y, MAP_HEIGHT * TILE_SIZE - canvas.height));
        }

        // Rendering
        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw map with fog of war
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    const screenX = x * TILE_SIZE - gameState.camera.x;
                    const screenY = y * TILE_SIZE - gameState.camera.y;

                    if (screenX < -TILE_SIZE || screenX > canvas.width ||
                        screenY < -TILE_SIZE || screenY > canvas.height) continue;

                    const worldX = x * TILE_SIZE + TILE_SIZE / 2;
                    const worldY = y * TILE_SIZE + TILE_SIZE / 2;
                    const dist = Math.hypot(worldX - gameState.player.x, worldY - gameState.player.y);

                    if (dist < VISION_RADIUS) {
                        // Visible
                        if (gameState.map[y][x] === 1) {
                            // Wall - sandy brick
                            ctx.fillStyle = '#c19a6b';
                            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#8b7355';
                            ctx.fillRect(screenX + 1, screenY + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                            ctx.fillStyle = '#a0826d';
                            ctx.fillRect(screenX + 2, screenY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        } else {
                            // Floor - sand
                            ctx.fillStyle = '#d2b48c';
                            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
                            // Random sand pixels
                            for (let i = 0; i < 3; i++) {
                                ctx.fillStyle = '#c19a6b';
                                ctx.fillRect(screenX + Math.random() * TILE_SIZE, screenY + Math.random() * TILE_SIZE, 1, 1);
                            }
                        }
                    } else {
                        // Fog of war
                        ctx.fillStyle = '#000';
                        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // Draw mirrors
            for (let mirror of gameState.mirrors) {
                const dist = Math.hypot(mirror.x - gameState.player.x, mirror.y - gameState.player.y);
                if (dist < VISION_RADIUS) {
                    const screenX = mirror.x - gameState.camera.x;
                    const screenY = mirror.y - gameState.camera.y;

                    ctx.fillStyle = '#87ceeb';
                    ctx.fillRect(screenX - 6, screenY - 6, 12, 12);
                    ctx.fillStyle = '#4682b4';
                    if (mirror.angle === 0) {
                        ctx.fillRect(screenX - 4, screenY - 4, 8, 2);
                        ctx.fillRect(screenX + 2, screenY + 2, 2, 8);
                    } else {
                        ctx.fillRect(screenX - 4, screenY + 2, 8, 2);
                        ctx.fillRect(screenX - 4, screenY - 4, 2, 8);
                    }
                }
            }

            // Draw crystal
            if (gameState.crystal) {
                const dist = Math.hypot(gameState.crystal.x - gameState.player.x, gameState.crystal.y - gameState.player.y);
                if (dist < VISION_RADIUS) {
                    const screenX = gameState.crystal.x - gameState.camera.x;
                    const screenY = gameState.crystal.y - gameState.camera.y;

                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(screenX - 6, screenY - 6, 12, 12);
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(screenX - 4, screenY - 4, 8, 8);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(screenX - 2, screenY - 2, 4, 4);
                }
            }

            // Draw enemies
            for (let enemy of gameState.enemies) {
                const dist = Math.hypot(enemy.x - gameState.player.x, enemy.y - gameState.player.y);
                if (dist < VISION_RADIUS) {
                    const screenX = enemy.x - gameState.camera.x;
                    const screenY = enemy.y - gameState.camera.y;

                    // Charging indicator
                    if (enemy.charging) {
                        ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                        ctx.fillRect(screenX - 10, screenY - 10, 20, 20);
                    }

                    // Enemy sprite
                    if (enemy.type === 'anubis') {
                        ctx.fillStyle = '#2f4f4f';
                        ctx.fillRect(screenX - 6, screenY - 8, 12, 16);
                        ctx.fillStyle = '#000';
                        ctx.fillRect(screenX - 4, screenY - 6, 3, 3);
                        ctx.fillRect(screenX + 1, screenY - 6, 3, 3);
                    } else {
                        ctx.fillStyle = '#8b7355';
                        ctx.fillRect(screenX - 6, screenY - 8, 12, 16);
                        ctx.fillStyle = '#654321';
                        ctx.fillRect(screenX - 4, screenY - 6, 8, 12);
                    }

                    // HP bar
                    const hpWidth = 12 * (enemy.hp / enemy.maxHp);
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(screenX - 6, screenY - 12, hpWidth, 2);
                }
            }

            // Draw lasers
            for (let laser of gameState.lasers) {
                const screenX = laser.x - gameState.camera.x;
                const screenY = laser.y - gameState.camera.y;

                ctx.fillStyle = '#00ffff';
                ctx.fillRect(screenX - 2, screenY - 2, 4, 4);
                ctx.fillStyle = '#fff';
                ctx.fillRect(screenX - 1, screenY - 1, 2, 2);
            }

            // Draw player
            const playerScreenX = gameState.player.x - gameState.camera.x;
            const playerScreenY = gameState.player.y - gameState.camera.y;

            if (gameState.player.parryActive) {
                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.fillRect(playerScreenX - 10, playerScreenY - 10, 20, 20);
            }

            ctx.fillStyle = '#d4af37';
            ctx.fillRect(playerScreenX - 6, playerScreenY - 8, 12, 16);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(playerScreenX - 4, playerScreenY - 6, 8, 12);
            ctx.fillStyle = '#000';
            ctx.fillRect(playerScreenX - 3, playerScreenY - 4, 2, 2);
            ctx.fillRect(playerScreenX + 1, playerScreenY - 4, 2, 2);
        }

        // UI updates
        function updateHP() {
            const percent = (gameState.player.hp / gameState.player.maxHp) * 100;
            document.getElementById('hpFill').style.width = percent + '%';
        }

        // Game over
        function endGame(victory) {
            gameState.gameOver = true;
            const gameOverDiv = document.getElementById('gameOver');
            const gameOverText = document.getElementById('gameOverText');

            if (victory) {
                gameOverText.innerHTML = '☥ ПОБЕДА! ☥<br>Кристалл Осириса твой!';
            } else {
                gameOverText.innerHTML = '☠ ПОРАЖЕНИЕ ☠<br>Гробница поглотила тебя...';
            }

            gameOverDiv.style.display = 'block';
        }

        // Game loop
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            if (!gameState.gameOver) {
                updatePlayer(dt);
                updateEnemies(dt);
                updateLasers(dt);
                updateCamera();
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        // Initialize game
        initMap();
        initEntities();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
